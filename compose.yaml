services:
  mail-service:
    build: .
    restart: unless-stopped
    ports:
      - "3102:3102"
    environment:
      PORT: 3102
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_REJECT_UNAUTHORIZED: "false"
      MAIL_FROM: no-reply@example.local
      MAIL_FROM_NAME: Exhibition Hub
      MAIL_API_KEY: ${MAIL_API_KEY:-local-development-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"
