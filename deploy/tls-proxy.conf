limit_req_zone $binary_remote_addr zone=mailservice_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mailservice_connections:10m;

server {
  listen 443 ssl;
  http2 on;
  server_name 45.9.188.69;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/45.9.188.69/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/45.9.188.69/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MailServiceTLS:10m;
  ssl_session_timeout 1d;

  client_max_body_size 16m;
  limit_req zone=mailservice_per_ip burst=30 nodelay;
  limit_req_status 429;
  limit_conn mailservice_connections 20;
  limit_conn_status 429;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    proxy_pass http://mail-service:3102;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
  }
}
